function normalized(s){return String(s||'').trim().toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').replace(/[.!?]+$/,'')}
function editDistance(a,b){let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let q=[i];for(let j=1;j<=b.length;j++)q[j]=Math.min(q[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}return p[b.length]}
function showFeedback(w,correct,typed=''){let target=$('#feedback');if(!target)return;let close=typed&&editDistance(normalized(typed),normalized(w.term))<=2;target.innerHTML=`<div class="answer"><strong>${esc(w.term)}</strong> — ${esc(w.translation)}<br><small>${esc(w.example)}</small>${typed?`<br><small>${correct?'✓ Правильно':close?'Почти! Проверь написание.':'Неверно, повтори слово.'}</small>`:''}</div>`;$('#grade').style.display='flex';if(correct)selected=w.id;else selected=-1}
function checkWriting(){if(revealed)return;let w=queue[idx],typed=$('#typed').value;revealed=true;showFeedback(w,normalized(typed)===normalized(w.term),typed)}
function speakCurrent(){let w=queue[idx];if(w)speak(w.id)}
function matchStart(){
 let source=queue.slice(0,Math.min(6,queue.length));
 matchPairs=[...shuffle(source.map(w=>({id:w.id,side:'en',label:w.term}))),...shuffle(source.map(w=>({id:w.id,side:'ru',label:w.translation})))];
 matchSelection=null;matchDone=new Set();renderMatch();
}
function renderMatch(note=''){
 let el=$('#exercise');if(!el)return;
 let half=matchPairs.length/2;
 if(!half){el.innerHTML='<div class="panel">Недостаточно слов для Match. Выбери «Все слова».</div>';return}
 const column=(items,offset)=>items.map((t,i)=>{let index=i+offset;return `<button type="button" class="match-tile ${matchDone.has(t.id)?'done':''} ${matchSelection===index?'picked':''}" ${matchDone.has(t.id)?'disabled':''} onclick="matchPick(${index})">${esc(t.label)}</button>`}).join('');
 el.innerHTML=`<div class="panel"><span class="eyebrow">Match · Найди пары</span><h2 style="margin:12px 0 8px">${matchDone.size} / ${half} пар</h2><p class="muted">Выбери английское слово слева и его перевод справа (или наоборот).</p><div class="match-columns"><div class="match-column">${column(matchPairs.slice(0,half),0)}</div><div class="match-column">${column(matchPairs.slice(half),half)}</div></div><p id="matchNote" class="match-note" aria-live="polite">${esc(note)}</p><div class="row" style="margin-top:18px"><button class="btn" onclick="matchStart()">Перемешать ↻</button><button class="btn primary" onclick="startPractice()">Новый набор →</button></div></div>`;
}
function matchPick(i){
 let tile=matchPairs[i];if(!tile||matchDone.has(tile.id))return;
 if(matchSelection===null){matchSelection=i;renderMatch();return}
 if(matchSelection===i){matchSelection=null;renderMatch('Выбор снят');return}
 let a=matchPairs[matchSelection],b=tile;
 if(a.side===b.side){matchSelection=i;renderMatch('Выбери перевод из другой колонки');return}
 let ok=a.id===b.id;
 if(ok){matchDone.add(a.id);let w=state.words.find(w=>w.id===a.id);if(w){w.matches=(w.matches||0)+1;save()}}
 matchSelection=null;
 renderMatch(ok?(matchDone.size===matchPairs.length/2?'Все пары найдены! Отлично!':'Верно ✓'):'Пока не совпадает. Попробуй ещё.');
}
function speak(id){let w=state.words.find(w=>w.id===id);if(!('speechSynthesis'in window)){toast('Озвучка не поддерживается');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w.term);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}function startPractice(reset=true){if(reset||!queue.length){let pool=state.words.filter(w=>(practiceFolder==='all'||w.folder===practiceFolder)&&(practiceScope==='all'||practiceScope==='due'&&(!w.due||w.due<=Date.now())||practiceScope==='mistakes'&&(w.mistakes||0)>0||practiceScope==='favorites'&&w.favorite));queue=shuffle(pool).slice(0,mode==='match'?6:mode==='test'?20:12);idx=0;score=0}selected=null;revealed=false;if(mode==='match'){matchStart();return}exercise()}
function exercise(){let el=$('#exercise');if(!el)return;if(!queue.length){el.innerHTML='<div class="panel">В этой подборке нет слов. Выбери «Все слова» или другую коллекцию.</div>';return}if(idx>=queue.length){el.innerHTML=`<div class="panel"><span class="eyebrow">Session complete</span><h2 style="font-size:50px;margin:15px 0">${score} / ${queue.length}</h2><p>Повторения сохранены.</p><button class="btn primary" onclick="startPractice()">Еще раз →</button></div>`;return}let w=queue[idx],pct=Math.round(idx/queue.length*100),reverse=practiceDirection==='ruen';let promptText=mode==='choice'?(reverse?w.translation:w.term):mode==='reverse'?w.translation:mode==='sentence'?(w.example||'').replace(new RegExp(w.term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),'_____'):mode==='write'?w.translation:mode==='listen'?'🔊 Listen and type':w.term;let field=mode==='reverse'?'term':reverse?'term':'translation',choices=[];if(mode==='choice'||mode==='reverse'||mode==='test'){choices=shuffle([w,...shuffle(state.words.filter(x=>x.id!==w.id&&x[field]&&x[field]!==w[field])).slice(0,3)])}if(mode==='flash'){el.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="eyebrow">Flashcards</span><span class="muted">${idx+1} / ${queue.length}</span></div><div class="progress" style="margin:15px 0"><div style="width:${pct}%"></div></div><button class="flipcard" onclick="revealed=!revealed;exercise()"><small>${revealed?'ANSWER':'TAP TO FLIP'}</small><strong>${esc(revealed?(reverse?w.term:w.translation):(reverse?w.translation:w.term))}</strong><small>${revealed?esc(w.example||''):'Нажми, чтобы перевернуть'}</small></button><div class="row" style="margin-top:16px"><button class="btn" onclick="grade(false)">Again ↺</button><button class="btn primary" onclick="grade(true)">I knew it ✓</button></div></div>`;return}let isChoice=mode==='choice'||mode==='reverse'||mode==='test';el.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="eyebrow">${mode==='test'?'Quick test':mode==='write'?'Write from memory':mode==='listen'?'Listening':mode==='sentence'?'Complete the sentence':'Recall'}</span><span class="muted">${idx+1} / ${queue.length}</span></div><div class="progress" style="margin:15px 0"><div style="width:${pct}%"></div></div><div class="question">${esc(promptText||w.term)}</div>${mode==='listen'?`<button class="btn" onclick="speakCurrent()">▶ Прослушать ещё</button>`:''}${isChoice?`<div class="options">${choices.map(x=>`<button class="option" data-id="${x.id}" onclick="pick(${x.id})">${esc(x[field])}</button>`).join('')}</div>`:mode==='write'||mode==='listen'||mode==='sentence'&&(w.example||'').toLowerCase().includes(w.term.toLowerCase())?`<input id="typed" class="search" style="width:100%" placeholder="Введи слово по-английски" autocomplete="off" onkeydown="if(event.key==='Enter')checkWriting()"><div class="row" style="margin-top:14px"><button class="btn primary" onclick="checkWriting()">Проверить →</button></div>`:`<button class="btn" onclick="reveal()">Показать ответ</button>`}<div id="feedback"></div><div class="row" id="grade" style="margin-top:16px;display:none"><button class="btn" onclick="grade(false)">Again ↺</button><button class="btn primary" onclick="grade(true)">I knew it ✓</button></div></div>`;if(mode==='listen')setTimeout(speakCurrent,100)}
function pick(id){if(revealed)return;let w=queue[idx];selected=id;revealed=true;document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(+b.dataset.id===w.id)b.classList.add('correct');else if(+b.dataset.id===id)b.classList.add('wrong')});$('#feedback').innerHTML=`<div class="answer">${esc(w.term)} — ${esc(w.translation)}<br><small>${esc(w.example)}</small></div>`;$('#grade').style.display='flex'}function checkTyped(){if(revealed)return;let w=queue[idx],typed=$('#typed').value.trim().toLowerCase();selected=typed===w.term.toLowerCase()?w.id:-1;reveal()}function reveal(){if(revealed)return;revealed=true;let w=queue[idx];$('#feedback').innerHTML=`<div class="answer"><strong>${esc(w.term)}</strong> — ${esc(w.translation)}<br><small>${esc(w.example)}</small></div>`;$('#grade').style.display='flex'}function grade(ok){if((mode==='choice'||mode==='reverse'||mode==='test'||mode==='write'||mode==='listen'||mode==='sentence')&&selected!==null)ok=ok&&selected===queue[idx].id;let w=queue[idx];if(!ok)w.mistakes=(w.mistakes||0)+1;if(ok){score++;w.interval=w.interval===0?1:w.interval===1?3:Math.min(120,Math.round(w.interval*w.ease));w.ease=Math.min(3,w.ease+.08)}else{w.interval=0;w.ease=Math.max(1.3,w.ease-.2)}w.reviews++;w.due=Date.now()+(ok?w.interval*86400000:0);save();idx++;selected=null;revealed=false;exercise()}function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}function exportJSON(){download('word-archive-backup.json',JSON.stringify({version:1,words:state.words},null,2),'application/json')}function exportCSV(){let rows=[['term','translation','level','example','folder','phonetic','definition','collocations'],...state.words.map(w=>[w.term,w.translation,w.level,w.example,w.folder,w.phonetic||'',w.definition||'',(w.collocations||[]).join('; ')])];download('word-archive.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}async function importJSON(input){try{let obj=JSON.parse(await input.files[0].text()),words=Array.isArray(obj)?obj:obj.words;if(!Array.isArray(words))throw Error('Invalid format');let n=0;for(let w of words)if(w.term&&w.translation)n+=upsert(w)?1:0;save();toast(`${n} новых слов импортировано`);go('dictionary')}catch(e){toast('Ошибка JSON: '+e.message)}}render();
</script></body></html>
