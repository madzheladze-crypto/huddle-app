<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Huddle</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #121217; --card: #1d1d25; --line: #2c2c37; --text: #f4f2ee; --muted: #9b99a6;
      --accent: #ff6b4a; --accent-ink: #ffffff; --soft: #26242e;
      --ice0: #1b2b3a; --ice1: #10263f; --ice2: #07162b;
    }
    [data-theme="light"] {
      --bg: #f6f3ee; --card: #ffffff; --line: #e6e1d8; --text: #1b1a20; --muted: #75717d;
      --soft: #efeae2; --ice0: #e6f4fb; --ice1: #bfe0f2; --ice2: #1f4f78;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; transition: background .6s ease;
    }
    #app { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
    .muted { color: var(--muted); }

    .hero { padding: 28px 0 22px; }
    .logo { font-size: 44px; font-weight: 800; letter-spacing: -1.5px; }
    .hero p { font-size: 16px; margin-top: 2px; }

    .tile { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line);
      border-radius: 22px; padding: 20px; margin-bottom: 12px; }
    .tile h2 { font-size: 22px; margin: 10px 0 6px; letter-spacing: -.3px; }
    .tile p { color: var(--muted); font-size: 14px; line-height: 1.4; }
    .tile.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .tile.accent p { color: rgba(255,255,255,.85); }
    .tile.soon { opacity: .7; }
    .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
      background: rgba(255,255,255,.22); }
    .tag.dim { background: var(--soft); color: var(--muted); }

    .top { display: flex; gap: 12px; align-items: flex-start; margin: 4px 0 18px; }
    .top h1 { font-size: 26px; letter-spacing: -.5px; }
    .top p { font-size: 14px; margin-top: 4px; line-height: 1.35; }
    .back { font-size: 22px; line-height: 1; padding: 4px 8px 4px 0; }
    .tg .back { display: none; }

    .players { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 14px; }
    .players-head { display: flex; justify-content: space-between; font-size: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .chip { background: var(--soft); border-radius: 999px; padding: 6px 6px 6px 12px; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
    .chip button { width: 22px; height: 22px; border-radius: 50%; color: var(--muted); }
    .add { display: flex; gap: 8px; }
    .add input, textarea { flex: 1; font: inherit; color: var(--text); background: var(--soft); border: 1px solid var(--line);
      border-radius: 12px; padding: 10px 12px; outline: none; }
    textarea { width: 100%; min-height: 90px; margin-top: 14px; resize: none; }
    .hint { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 4px 2px 14px; }

    .game, .task { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; background: var(--card);
      border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin-bottom: 8px; }
    .game .emoji { font-size: 28px; width: 40px; text-align: center; }
    .game b { display: block; font-size: 17px; margin-bottom: 2px; }
    .game .muted { font-size: 13px; line-height: 1.35; }
    .task { align-items: flex-start; font-size: 15px; line-height: 1.4; flex-wrap: wrap; }
    .task .n { font-weight: 700; color: var(--accent); min-width: 18px; }
    .task span:nth-child(2) { flex: 1; }
    .task .tag { background: var(--soft); color: var(--muted); margin-left: 32px; }

    .counter { font-size: 13px; color: var(--muted); margin-bottom: 8px; text-align: center; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 28px 22px; min-height: 200px;
      display: flex; flex-direction: column; justify-content: center; margin-bottom: 14px; }
    .card .big { font-size: 22px; line-height: 1.35; font-weight: 600; letter-spacing: -.2px; }
    .card .prefix { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
    .flip { animation: flip .35s ease; }
    @keyframes flip { from { transform: rotateY(80deg) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }

    .btn { display: block; width: 100%; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 16px;
      border-radius: 16px; padding: 15px; margin-bottom: 10px; }
    .btn.ghost { background: var(--soft); color: var(--text); }
    .btn.small { width: auto; padding: 10px 16px; margin: 0; }
    .btn:disabled { opacity: .5; }
    .row { display: flex; gap: 10px; }
    .row .btn { flex: 1; }
    .link { display: block; margin: 6px auto 0; color: var(--muted); font-size: 14px; }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: grid; place-items: center; z-index: 10; }
    .count { font-size: 120px; font-weight: 800; color: #fff; animation: pop .8s ease; }
    .count.go { font-size: 40px; text-align: center; padding: 0 20px; }
    @keyframes pop { from { transform: scale(1.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .sheet-wrap { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; z-index: 10; padding: 16px; }
    .sheet { width: 100%; max-width: 520px; margin: 0 auto; }
    .sheet .btn { margin: 20px 0 0; }

    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
    .num { aspect-ratio: 1; background: var(--card); border: 1px solid var(--line); border-radius: 16px; font-size: 22px; font-weight: 700; }
    .num.used { opacity: .3; text-decoration: line-through; }

    .five { list-style: none; }
    .five li { font-size: 17px; line-height: 1.35; padding: 7px 0; border-bottom: 1px solid var(--line); }
    .five li:last-child { border: 0; }
    .five b { display: inline-block; width: 26px; color: var(--accent); font-size: 20px; }
    .timer-slot:empty { display: none; }
    .ring { position: relative; width: 120px; height: 120px; margin: 0 auto 14px; }
    .ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .ring circle { fill: none; stroke-width: 8; }
    .ring .track { stroke: var(--soft); }
    .ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    .ring .secs { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; font-weight: 700; }

    .sides { display: flex; gap: 10px; margin-bottom: 14px; }
    .side { flex: 1; border-radius: 18px; padding: 14px; background: var(--card); border: 1px solid var(--line); }
    .side span { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    .side b { display: block; font-size: 18px; margin-top: 4px; }
    .side.pro span { color: #3fbf7f; } .side.con span { color: var(--accent); }
    .score { font-size: 14px; color: var(--muted); text-align: center; margin-top: 6px; }

    /* Айсберг */
    body.sea.l0 { background: var(--ice0); }
    body.sea.l1 { background: var(--ice1); }
    body.sea.l2 { background: var(--ice2); }
    body.sea.l1, body.sea.l2 { --text: #eef6fb; --muted: #9fc0d6; --card: rgba(255,255,255,.08); --line: rgba(255,255,255,.14); --soft: rgba(255,255,255,.12); color: var(--text); }
    .berg svg { width: 100%; max-width: 320px; display: block; margin: 0 auto 10px; }
    .berg .water { fill: #2e7bb8; opacity: .35; }
    .berg .ice.top { fill: #eaf7ff; } .berg .ice.mid { fill: #9dd0ee; } .berg .ice.deep { fill: #3f7fae; }
    .berg .line { stroke: #2e7bb8; stroke-width: 2; stroke-dasharray: 6 5; }
    .layers { list-style: none; margin-bottom: 12px; }
    .lay { padding: 10px 14px; border-radius: 14px; margin-bottom: 6px; font-size: 15px; background: var(--card); border: 1px solid var(--line); }
    .lay.l0 { border-left: 5px solid #bfe6fb; } .lay.l1 { border-left: 5px solid #5aa6d6; } .lay.l2 { border-left: 5px solid #1f4f78; }
    .depth { display: flex; gap: 6px; margin-bottom: 14px; }
    .depth .seg { flex: 1; height: 6px; border-radius: 3px; background: var(--soft); }
    .depth .seg.on { background: #5aa6d6; }
    .dive { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #eef6fb; animation: dive 1.5s ease forwards; }
    .dive.l1 { background: #10263f; } .dive.l2 { background: #07162b; }
    .dive p { font-size: 32px; font-weight: 800; } .dive span { margin-top: 6px; color: #9fc0d6; }
    @keyframes dive { 0% { transform: translateY(100%); } 25%, 80% { transform: none; opacity: 1; } 100% { opacity: 0; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    // номер сборки: меняется при каждом обновлении, чтобы Telegram не показывал старые файлы
    window.HUDDLE_BUILD = "20261007-6";
    document.write('<script src="content/friends-lite.js?v=' + HUDDLE_BUILD + '"><\/script>');
    document.write('<script src="app.js?v=' + HUDDLE_BUILD + '"><\/script>');
  </script>
</body>
</html>
