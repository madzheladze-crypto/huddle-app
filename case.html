<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Huddle · Детектив</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #0E1013; overflow: hidden; overscroll-behavior: none; }
    #stage { position: absolute; top: 0; left: 0; width: 390px; transform-origin: 0 0; overflow: hidden; }
    #stage [data-root] { touch-action: manipulation; }
    #stage [data-drop="cork"] { touch-action: none; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script>
    // какое дело открыть: case.html?case=tikhaya-noch (v — номер сборки, чтобы не брать старые файлы из кэша)
    var params = new URLSearchParams(location.search);
    var caseId = params.get('case') || 'tikhaya-noch';
    var ver = (params.get('v') || '1').replace(/[^0-9a-z-]/gi, '');
    document.write('<script src="cases/dc-lite.js?v=' + ver + '"><\/script>');
    document.write('<script src="cases/' + caseId.replace(/[^a-z0-9-]/g, '') + '.js?v=' + ver + '"><\/script>');
  </script>
  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      var C = window.HUDDLE_CASES && window.HUDDLE_CASES[caseId];
      var stage = document.getElementById('stage');
      if (!C) { stage.innerHTML = '<p style="color:#E9E3D6;font:16px sans-serif;padding:24px">Дело не найдено.</p>'; return; }
      document.head.insertAdjacentHTML('beforeend', C.head);

      if (tg) {
        try { tg.ready(); tg.expand(); tg.setHeaderColor('#0E1013'); tg.setBackgroundColor('#0E1013'); } catch (e) {}
        try { tg.BackButton.show(); tg.BackButton.onClick(function () { goBack(); }); } catch (e) {}
      }

      // «Назад» Telegram ведёт на шаг назад внутри дела: сначала закрывает окна, потом в папку/кабинет, из кабинета — на главную Huddle
      var rt = null, lastSpot = null;
      function goBack() {
        if (!rt) { location.href = 'index.html'; return; }
        var c = rt.comp, s = c.state, v = c.renderVals();
        if (s.pick || s.slotPick) return v.closePick();
        if (s.sheet) return v.closeSheet();
        if (s.zoom) return v.closeZoom();
        if (s.thought) return v.closeThought();
        if (s.tour && s.screen === 'office') return v.closeTour();
        if (s.screen === 'mat' || s.screen === 'iq') return v.toFolder();
        if (['folder', 'board', 'timeline', 'notes', 'dima', 'report', 'done'].indexOf(s.screen) >= 0) return v.toOffice();
        if (s.screen === 'letter') return v.toName();
        if (s.screen === 'name') return c.go('intro');
        location.href = 'index.html';
      }

      // экран дела нарисован под ширину 390 — растягиваем его на весь телефон
      function fit() {
        var w = document.documentElement.clientWidth || window.innerWidth;
        var h = (tg && tg.viewportStableHeight) || window.innerHeight;
        var k = Math.min(w / 390, 1.25);
        stage.style.transform = 'scale(' + k + ')';
        stage.style.left = Math.max(0, (w - 390 * k) / 2) + 'px';
        var root = stage.querySelector('[data-root]');
        if (root) root.style.height = Math.round(h / k) + 'px';
        stage.style.height = Math.round(h / k) + 'px';
      }
      window.addEventListener('resize', fit);
      if (tg && tg.onEvent) tg.onEvent('viewportChanged', fit);

      // щипок двумя пальцами на доске улик — масштаб
      var pinch = null;
      function dist(t) { var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY; return Math.sqrt(dx * dx + dy * dy); }
      stage.addEventListener('touchstart', function (e) {
        if (e.touches.length === 2 && e.target.closest && e.target.closest('[data-pinch]') && rt) {
          pinch = { d: dist(e.touches), z: rt.comp.state.boardZ || 1 };
          rt.comp._drag = null;
        }
      }, { passive: true });
      stage.addEventListener('touchmove', function (e) {
        if (!pinch || e.touches.length !== 2) return;
        e.preventDefault();
        rt.comp.setBoardZoom(pinch.z * dist(e.touches) / pinch.d);
      }, { passive: false });
      stage.addEventListener('touchend', function (e) { if (e.touches.length < 2) pinch = null; }, { passive: true });

      // сохранение прогресса (на этом телефоне)
      var KEY = 'huddle:case:' + caseId;
      var SKIP = { ghost: 1, push: 1, toast: 1, typing: 1, pick: 1, slotPick: 1, pickQ: 1, thought: 1, zoom: 1, sheet: 1 };
      var saveT = null;
      function save(comp) {
        clearTimeout(saveT);
        saveT = setTimeout(function () {
          var out = {};
          Object.keys(comp.state).forEach(function (k) { if (!SKIP[k]) out[k] = comp.state[k]; });
          try { localStorage.setItem(KEY, JSON.stringify(out)); } catch (e) {}
        }, 600);
      }
      function load() {
        try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; }
      }

      rt = DCLite.start(stage, C.template, C.Component, {
        beforeFirst: function (comp) {
          var saved = load();
          if (saved && saved.screen) {
            Object.assign(comp.state, saved, { ghost: null, push: null, toast: '', typing: false, pick: false, slotPick: null, thought: null, zoom: false, sheet: null });
            if (comp.resumeLiza) comp.resumeLiza();
          }
        },
        extraVals: function () { return { isDev: params.get('dev') === '1' }; },
        afterRender: function (comp) {
          fit(); save(comp);
          // в обучении прокручиваем кабинет к подсвеченному предмету
          var spot = stage.querySelector('[data-tour-spot]');
          var key = spot ? spot.getAttribute('data-tour-spot') : null;
          if (key !== lastSpot) { lastSpot = key; if (spot && spot.scrollIntoView) spot.scrollIntoView({ block: 'center' }); }
        }
      });
    })();
  </script>
</body>
</html>
